name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Run all regressions without dependency skips
        run: python tests/run_tests.py --require-decompiler
      - name: Check cold-process startup with --debug
        run: python tests/benchmark_startup.py --samples 9 --max-total-ms 100 --max-wall-ms 250
      - name: Check supplied DEX benchmarks and 0.0880 s budget
        run: python tests/benchmark_reference.py --samples 9
      - name: Upload benchmark timings and raw debug logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: benchmarks-python-${{ matrix.python-version }}
          path: |
            artifacts/startup/
            artifacts/reference/
          if-no-files-found: warn
