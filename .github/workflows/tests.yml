name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Run all regressions without dependency skips
        run: python tests/run_tests.py --require-decompiler
      - name: Check cold-process startup with --debug
        run: python tests/benchmark_startup.py --samples 9 --max-total-ms 100 --max-wall-ms 250
      - name: Upload startup timings and raw debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-python-${{ matrix.python-version }}
          path: artifacts/startup/
          if-no-files-found: warn
