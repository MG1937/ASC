[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "droidasc"
version = "0.1.0"
description = "Android DEX decompiler and reference finder"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "androguard>=4.1.3",
]

[project.scripts]
droidasc = "droidasc:main"

[tool.setuptools.packages.find]
include = ["droidasc", "droidasc.*"]

[tool.setuptools.package-data]
"droidasc" = ["py.typed"]